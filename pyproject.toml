[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colonia-flood"
version = "0.1.0"
description = "Sentinel-1 RTC acquisition manifests for the Colonia Flood Risk Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "pystac-client>=0.8,<0.10",
    "shapely>=2.1.2,<3",
    "pyproj>=3.7,<4",
    # 1.4 supports Python 3.11; 1.5 requires Python >=3.12.
    "rasterio>=1.4.4,<1.6",
    # Keep dependency stubs compatible with the project's Python 3.11 mypy target.
    "numpy>=2.1,<2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-shapely>=2.1,<3",
]

[project.scripts]
colonia-flood-manifest = "colonia_flood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requires live network access to the STAC catalog (deselected by default)",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pystac_client.*", "pystac.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true
